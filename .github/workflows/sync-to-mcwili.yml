# Push Yevucee/zuraio main to Mcwili/zuraio production (requires your collaborator PAT).
# Setup: GitHub → Yevucee/zuraio → Settings → Secrets → MCWILI_PUSH_TOKEN
# (fine-grained PAT: Mcwili/zuraio contents read+write, or classic repo scope)
# Run: Actions → Sync to Mcwili production → Run workflow

name: Sync to Mcwili production

on:
  workflow_dispatch:
    inputs:
      backup_legacy:
        description: 'Update legacy/mcwili-old-site from current Mcwili main before push'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      allow_legal_placeholders:
        description: 'Allow Impressum/privacy placeholders (one-time go-live override; default false)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build production dist
        run: npm run build
        env:
          CANONICAL_BASE: https://zuraio.ch
          SITE_BASE_PATH: ''

      - name: Legal go-live guard (Impressum / privacy)
        env:
          ALLOW_LEGAL_PLACEHOLDERS: ${{ inputs.allow_legal_placeholders }}
        run: node scripts/check-legal-go-live.mjs

      - name: Push to Mcwili/zuraio
        env:
          MCWILI_TOKEN: ${{ secrets.MCWILI_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MCWILI_TOKEN}" ]; then
            echo "::error::Add repository secret MCWILI_PUSH_TOKEN (PAT with push access to Mcwili/zuraio)."
            exit 1
          fi
          git remote add mcwili "https://x-access-token:${MCWILI_TOKEN}@github.com/Mcwili/zuraio.git"
          git fetch mcwili main || true

          if git show-ref --verify --quiet refs/remotes/mcwili/main; then
            git tag -f pre-new-site-2026-10-10 mcwili/main
            git push mcwili refs/tags/pre-new-site-2026-10-10 --force
            echo "Tagged Mcwili main as pre-new-site-2026-10-10 (rollback point)."
          fi

          if [ "${{ inputs.backup_legacy }}" = "true" ] && git show-ref --verify --quiet refs/remotes/mcwili/main; then
            git push mcwili mcwili/main:refs/heads/legacy/mcwili-old-site
            echo "Updated legacy/mcwili-old-site from previous Mcwili main."
          fi

          git push mcwili HEAD:refs/heads/main --force-with-lease=main
          echo "Pushed current main to Mcwili/zuraio main."
